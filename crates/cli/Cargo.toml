[package]
name = "diff-motion-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Michal Siniarski <siniarskim@gmail.com>"]

[features]
default = ["display"]
display = ["diff-motion-core/display"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
diff-motion-core = { path = "../core", default-features = false }
