[package]
name = "diff-motion-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Michal Siniarski <siniarskim@gmail.com>"]

[features]
default = ["display"]
display = ["diff-motion-core/display"]

[lib]
name = "diff_motion"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
diff-motion-core = { path = "../core", default-features = false }

[build-dependencies]
pyo3-build-config = "0.22"
